services:
  - type: web
    name: revyu-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -e .
    startCommand: alembic upgrade head && python -m app.seeds.plans && python -m app.seeds.dev_outlet && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Supabase Session pooler string (port 5432), with ?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: local
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: FRONTEND_BASE_URL
        sync: false
      - key: PUBLIC_FLOW_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
